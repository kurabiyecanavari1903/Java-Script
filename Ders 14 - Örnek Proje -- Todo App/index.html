<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h2>Todo App</h2>
    <input type="text" id="todoInput" placeholder="Bir görev girin" />
    <button id="addBtn">Ekle</button>

    <ul id="todoList"></ul>

    <script src="script.js"></script>
    <script>
      const input = document.getElementById("todoInput");
      const addBtn = document.getElementById("addBtn");
      const todoList = document.getElementById("todoList");

      addBtn.addEventListener("click", () => {
        const value = input.value.trim();
        if (value === "") {
          alert("Input boş olamaz!");
        } else {
          // Li etiketi oluşturuldu
          const li = document.createElement("li");
          li.textContent = value;

          // Tamamlandı butonu oluşturuldu
          const doneBtn = document.createElement("button");
          doneBtn.textContent = "Tamamlandı";
          doneBtn.addEventListener("click", () => {
            li.style.textDecoration = "line-through";
          });

          // Sil butonu oluşturuldu
          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Sil";
          deleteBtn.addEventListener("click", {
            todoList.removeChild(li)
          })

          // Elemanları birleştir
          li.appendChild(doneBtn)
          li.appendChild.(deleteBtn)
          todoList.appendChild(li)
        }
      });
    </script>
  </body>
</html>
